name: SRK Deployment Monitor
on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
concurrency:
  group: srk-deployment-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report latest Android runs by branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run list --repo "$GITHUB_REPOSITORY" --workflow main.yml --limit 100 --json databaseId,headBranch,headSha,status,conclusion,url,createdAt > "$RUNNER_TEMP/runs.json"
          jq 'sort_by(.createdAt) | reverse | unique_by(.headBranch) | .[] | {headBranch,headSha,status,conclusion,url}' "$RUNNER_TEMP/runs.json"
          jq -r 'sort_by(.createdAt) | reverse | unique_by(.headBranch) | .[] | "- \(.headBranch) \(.headSha[0:12]): \(.status)/\(.conclusion) \(.url)"' "$RUNNER_TEMP/runs.json" >> "$GITHUB_STEP_SUMMARY"
          if jq -e 'sort_by(.createdAt) | reverse | unique_by(.headBranch) | any(.status == "completed" and .conclusion == "failure")' "$RUNNER_TEMP/runs.json" >/dev/null; then
            echo "::warning::At least one monitored branch has a failed latest run. Review exact SHA before repair."
          fi
