buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 34
        ndkVersion = "25.1.8937393"
        kotlinVersion = "2.2.10"
        media3Version = "1.4.1"
        transitionVersion = "1.5.1"
        coreVersion = "1.13.1"
        ffmpegKitPackage = "audio-lts"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.9.1")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

apply plugin: "com.facebook.react.rootproject"

subprojects {
    if (name != "rncompat") {
        plugins.withId("com.android.library") {
            dependencies.add("compileOnly", project(":rncompat"))
        }
        plugins.withId("com.android.application") {
            dependencies.add("compileOnly", project(":rncompat"))
        }
    }

    configurations.all {
        resolutionStrategy {
            // Keep the Kotlin compiler/runtime aligned with LibVLC 3.7.7 metadata (2.2.x).
            force "org.jetbrains.kotlin:kotlin-stdlib:${rootProject.ext.kotlinVersion}"
            force "org.jetbrains.kotlin:kotlin-stdlib-common:${rootProject.ext.kotlinVersion}"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:${rootProject.ext.kotlinVersion}"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:${rootProject.ext.kotlinVersion}"
            force "org.jetbrains.kotlin:kotlin-reflect:${rootProject.ext.kotlinVersion}"
            force "androidx.core:core:${rootProject.ext.coreVersion}"
            force "androidx.core:core-ktx:${rootProject.ext.coreVersion}"
            force "androidx.transition:transition:${rootProject.ext.transitionVersion}"
            force "androidx.transition:transition-ktx:${rootProject.ext.transitionVersion}"

            force "androidx.media3:media3-common:${rootProject.ext.media3Version}"
            force "androidx.media3:media3-container:${rootProject.ext.media3Version}"
            force "androidx.media3:media3-database:${rootProject.ext.media3Version}"
            force "androidx.media3:media3-datasource:${rootProject.ext.media3Version}"
            force "androidx.media3:media3-datasource-okhttp:${rootProject.ext.media3Version}"
            force "androidx.media3:media3-decoder:${rootProject.ext.media3Version}"
            force "androidx.media3:media3-exoplayer:${rootProject.ext.media3Version}"
            force "androidx.media3:media3-exoplayer-dash:${rootProject.ext.media3Version}"
            force "androidx.media3:media3-exoplayer-hls:${rootProject.ext.media3Version}"
            force "androidx.media3:media3-exoplayer-smoothstreaming:${rootProject.ext.media3Version}"
            force "androidx.media3:media3-extractor:${rootProject.ext.media3Version}"
            force "androidx.media3:media3-session:${rootProject.ext.media3Version}"
            force "androidx.media3:media3-ui:${rootProject.ext.media3Version}"
        }
    }
}
